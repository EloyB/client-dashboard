services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: client_dashboard
      POSTGRES_PASSWORD: client_dashboard
      POSTGRES_DB: client_dashboard
    ports:
      - '5437:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1026:1025' # SMTP — the app sends here in development
      - '8026:8025' # Web UI — view caught emails at http://localhost:8026

volumes:
  postgres_data:
